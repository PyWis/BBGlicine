<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B&amp;B Il Glicine · 3D</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2620;--muted:#7a6f62;--card:rgba(255,252,246,.94);--line:rgba(60,45,30,.12);--accent:#7b5ea7;--ok:#3f9a5c;--bad:#c9483f;--warn:#e0962e;--blue:#4f86c6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:#cfe6f2}
  #app{position:fixed;inset:0}
  canvas{display:block}
  button{font:inherit}
  .card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(40,30,20,.12)}

  /* Pannello sinistro: viste */
  #panel{position:fixed;top:16px;left:16px;width:240px;padding:14px}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#9b7fc9,#6c4f9a);color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
  h1{font-family:Fraunces,serif;font-size:18px;margin:0;line-height:1.1}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  #menuBtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 8px;cursor:pointer}
  #panel.collapsed .body{display:none}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .grid button{font-size:12.5px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-align:left}
  .grid button:hover{border-color:var(--accent)}
  .grid button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid button.wide{grid-column:span 2}
  .langSel{width:100%;font:inherit;font-size:13px;padding:5px 7px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .mHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .mHead .langSel{width:auto;flex:none}
  .tog{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;padding:4px 0;cursor:pointer;user-select:none}
  .tog input{appearance:none;width:32px;height:19px;border-radius:20px;background:#d9d1c5;position:relative;cursor:pointer;transition:.2s;margin:0}
  .tog input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
  .tog input:checked{background:var(--accent)}
  .tog input:checked::after{left:15px}

  /* HUD */
  #hud{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px;white-space:nowrap}
  #clock{font-family:Fraunces,serif;font-size:22px;line-height:1}
  #dayLbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .vsep{width:1px;height:30px;background:var(--line)}
  .speed{display:flex;gap:3px}
  .speed button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;font-size:13px;min-width:34px}
  .speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stat{font-size:12px;color:var(--muted);line-height:1.15}
  .stat b{display:block;font-size:15px;color:var(--ink)}
  #stars{color:#e0a92e;letter-spacing:1px}
  #gear{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:16px}

  /* Bancone (destra) */
  #desk{position:fixed;top:16px;right:16px;bottom:16px;width:340px;padding:14px 14px 10px;overflow:auto}
  #desk h3{font-family:Fraunces,serif;font-size:17px;margin:0}
  #desk h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
  .deskHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff}
  .closedBox{margin-top:10px;padding:10px;border-radius:12px;background:#2f3346;color:#fff;font-size:13px;line-height:1.4}
  .closedBox button{margin-top:8px;border:0;border-radius:8px;padding:6px 10px;background:#fff;color:#2f3346;cursor:pointer;font-weight:700}
  .empty{font-size:13px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:12px;text-align:center;margin-top:10px}
  .g{margin-top:10px;padding:10px 11px;border-radius:12px;background:#fff;border:1px solid var(--line)}
  .g.in{border-left:4px solid var(--ok)}
  .g.out{border-left:4px solid var(--blue)}
  .g.walking{opacity:.6}
  .gTop{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .gName{font-weight:700;font-size:14px}
  .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:10px;color:#fff;flex:none}
  .gMeta{font-size:12.5px;color:var(--muted);margin:3px 0 6px}
  .bar{height:5px;border-radius:5px;background:#eee6da;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:5px;background:var(--ok);transition:width .3s linear}
  .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .acts button{border:1px solid var(--line);background:#faf7f1;border-radius:8px;padding:5px 8px;font-size:12.5px;cursor:pointer}
  .acts button.room{background:#eaf5ec;border-color:#b9dcc2}
  .acts button.room:disabled{background:#f2efe9;color:#b3aa9d;border-color:var(--line);cursor:not-allowed}
  .acts button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
  .acts button.ghost{color:var(--bad)}
  .acts button:not(:disabled):hover{filter:brightness(.95)}
  .rr{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer}
  .rr:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .rr .nm{font-weight:600;min-width:74px;flex:none;white-space:nowrap}
  .rr .st{flex:1;color:#4a4238;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rr .bar{width:54px;flex:none}
  .rr .bar i{background:var(--warn)}
  .maid{font-size:12.5px;color:var(--muted);margin-top:6px}
  .tl{font-size:12.5px;line-height:1.55}
  .tl span{color:var(--muted);display:inline-block;width:44px}
  #log{font-size:12px;line-height:1.5;color:#4a4238;max-height:180px;overflow:auto}
  #log div span{color:var(--muted);margin-right:5px}
  #log .bad{color:var(--bad)} #log .good{color:var(--ok)}

  #info{position:fixed;left:16px;bottom:16px;width:290px;padding:14px 16px;transition:.25s}
  #info.hidden{opacity:0;transform:translateY(10px);pointer-events:none}
  #info h2{font-family:Fraunces,serif;font-size:17px;margin:0 0 6px;padding-right:20px}
  #info .d{font-size:13px;line-height:1.45;margin:0 0 6px;color:#4a4238}
  #info .s{font-size:13px;font-weight:700;margin:0 0 6px}
  #info ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55}
  #infoClose{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  #tip{position:fixed;pointer-events:none;background:#2b2620;color:#fff;font-size:12.5px;padding:5px 9px;border-radius:7px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:20}
  #toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:15}
  .toast{background:#2b2620;color:#fff;font-size:13px;padding:7px 12px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .25s ease}
  @keyframes tin{from{opacity:0;transform:translateY(-6px)}}

  /* Modale impostazioni */
  #modal{position:fixed;inset:0;background:rgba(30,24,18,.45);display:grid;place-items:center;z-index:30;padding:16px}
  #modal.hidden{display:none}
  #modal .card{width:min(520px,100%);max-height:100%;overflow:auto;padding:22px 24px}
  #modal h2{font-family:Fraunces,serif;margin:0 0 6px;font-size:22px}
  #modal p{font-size:14px;line-height:1.5;color:#4a4238;margin:0 0 10px}
  .setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .setRow small{display:block;color:var(--muted);font-size:12px}
  .setRow select,.setRow input{font:inherit;padding:4px 6px;border-radius:7px;border:1px solid var(--line);background:#fff}
  .setRow input{width:70px}
  .mBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .mBtns button{border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
  #mGo{background:var(--accent);color:#fff}
  #mReset{background:#eee6da;color:var(--ink)}
  .rules{font-size:13px;line-height:1.5;margin:0 0 12px;padding-left:18px;color:#4a4238}

  @media (max-width:1180px){
    #panel{width:auto}
    #panel.collapsed{padding:10px}
    #hud{left:auto;right:372px;transform:none}
  }
  #camPad{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px;user-select:none;-webkit-user-select:none;touch-action:none}
  .pad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(2,30px);gap:3px}
  #camPad button{border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;padding:0;height:30px;min-width:34px;touch-action:none}
  #camPad button:active,#camPad button.hold{background:var(--ink);color:#fff}
  .padCol{display:flex;flex-direction:column;gap:3px}
  .mode{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-align:center}
  .mode div{display:flex;gap:3px}
  .mode button{font-size:12px!important;padding:0 8px!important}
  .mode button.on{background:var(--accent)!important;color:#fff;border-color:var(--accent)!important}
  .keys{font-size:11px;color:var(--muted);line-height:1.4;max-width:150px}
  #chat{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;width:min(500px,calc(100vw - 32px));height:min(64vh,580px);display:flex;flex-direction:column;padding:0;z-index:14;overflow:hidden}
  #chat.hidden{display:none}
  .chHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  #chName{font-weight:700;font-size:15px} #chSub{font-size:12px;color:var(--muted)}
  #chMin{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:28px;cursor:pointer}
  #chMsgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:84%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
  .bub.g{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .bub.r{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .bub.sys{align-self:center;background:#eee6da;font-size:12px;color:#4a4238;border-radius:10px}
  .typing{font-size:12.5px;color:var(--muted);font-style:italic}
  .chErr{font-size:12.5px;color:var(--bad);line-height:1.4}
  .chErr button{margin-left:6px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px;cursor:pointer}
  .rate{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
  .rate .stars,.rate b{color:#2b2620} .rate .stars{color:#e0a92e;letter-spacing:1px}
  .rate .rc{font-style:italic;color:#4a4238;margin-top:4px} .rate .rt{color:#5d4a8a;margin-top:4px}
  #chActs{padding:6px 14px 0;margin:0}
  #chForm{display:flex;gap:6px;padding:10px 14px 12px}
  #chIn{flex:1;resize:none;font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
  #chSend{border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:0 14px;cursor:pointer}
  #chSend:disabled,#chIn:disabled{opacity:.5;cursor:not-allowed}
  .acts button.talk{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .g.ask{border-left:4px solid var(--accent)}
  .gLang{font-size:12px;color:#4a4238;margin:-2px 0 6px}
  .tabs{display:flex;gap:4px;margin:4px 0 6px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;font-size:13px}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pane.hidden{display:none}
  .setRow input.wide,.setRow select.wide{width:240px;max-width:60vw}
  .setNote{font-size:12.5px;color:var(--muted);line-height:1.45;padding:8px 0}
  #testRes{font-size:12.5px;margin-left:8px}
  .setBtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;cursor:pointer}
  .lrow{display:grid;grid-template-columns:1fr 92px 120px;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .lrow.h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .lrow input[type=number]{width:62px;font:inherit;padding:3px 5px;border-radius:7px;border:1px solid var(--line)}
  .lrow label{display:flex;align-items:center;gap:6px;cursor:pointer}
  #modal .card{width:min(620px,100%)}
  .bub.fb{align-self:flex-end;max-width:90%;font-size:12.5px;border-radius:10px;padding:6px 10px}
  .bub.fb.ok{background:#e6f4ea;color:#2d6b40}
  .bub.fb.bad{background:#fbeaea;color:#8a2f29}
  .optH{flex-basis:100%;font-size:12px;color:var(--muted);margin-bottom:-1px}
  .acts button.opt{flex-basis:100%;text-align:left;background:#fff;border-color:#cdbfe3;font-size:13.5px;line-height:1.35;padding:7px 10px}
  .acts button.opt:not(:disabled):hover{background:#f3eefa;filter:none}
  .acts button.opt b{color:var(--accent);margin-right:6px}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .modes button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink)}
  .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #modeBox .sec{margin-top:4px}
  #modeNote{min-height:3em}
  @media (max-width:860px){ #chat{left:0;right:0;top:0;bottom:0;width:auto;height:auto;transform:none;border-radius:0} .lrow{grid-template-columns:1fr 80px 90px} }
  @media (max-width:1180px){ .keys{display:none} #camPad{left:16px;transform:none} #info{bottom:110px} }
  @media (max-width:860px){
    #camPad{left:10px;right:auto;bottom:calc(44vh + 82px);padding:6px}
    #panel{top:10px;left:10px;right:10px}
    #hud{top:auto;bottom:calc(44vh + 18px);left:10px;right:10px;transform:none;flex-wrap:wrap;justify-content:space-between;gap:8px}
    #desk{top:auto;left:10px;right:10px;bottom:10px;width:auto;height:44vh}
    #info{display:none}
    #toasts{top:70px}
  }
</style>
</head>
<body>
<div id="app"></div>

<aside id="panel" class="card">
  <div class="brand"><div class="logo">✿</div><div><h1>B&amp;B Il Glicine</h1><p data-i="sub"></p></div><button id="menuBtn" data-i-aria="menu">☰</button></div>
  <div class="body">
    <div class="sec" data-i="lang"></div>
    <select class="langSel" aria-label="Language"></select>
    <div class="sec" data-i="goTo"></div>
    <div id="views" class="grid"></div>
    <div class="sec" data-i="view"></div>
    <label class="tog"><span data-i="roof"></span><input type="checkbox" id="tRoof"></label>
    <label class="tog"><span data-i="low"></span><input type="checkbox" id="tLow" checked></label>
    <label class="tog"><span data-i="labels"></span><input type="checkbox" id="tLabels" checked></label>
  </div>
</aside>

<div id="hud" class="card">
  <div><div id="dayLbl"></div><div id="clock">07:00</div></div>
  <div class="speed" id="speed">
    <button data-s="0" data-i-title="pause">⏸</button>
    <button data-s="1" class="on" data-i-title="sp1">1×</button>
    <button data-s="5" data-i-title="sp5">5×</button>
    <button data-s="20" data-i-title="sp20">20×</button>
  </div>
  <div class="vsep"></div>
  <div class="stat"><span data-i="income"></span><b id="money">0 €</b></div>
  <div class="stat"><span data-i="reviews"></span><b><span id="stars">★★★★☆</span> <span id="repN">4.0</span></b></div>
  <div class="stat" data-i-title="heartsT"><span data-i="hearts"></span><b id="hearts">❤️ 0</b></div>
  <button id="gear" data-i-title="settings">⚙</button>
</div>

<aside id="desk" class="card">
  <div class="deskHead"><h3 data-i="desk"></h3><span id="openPill" class="pill"></span></div>
  <div id="closed"></div>
  <div id="queue"></div>
  <h4 data-i="rooms"></h4>
  <div id="roomsList"></div>
  <div class="maid" id="maidLine"></div>
  <h4 data-i="today"></h4>
  <div id="today" class="tl"></div>
  <h4 data-i="log"></h4>
  <div id="log"></div>
</aside>

<div id="info" class="card hidden"><button id="infoClose" data-i-aria="close">×</button><h2></h2><p class="s"></p><p class="d"></p><ul></ul></div>
<div id="camPad" class="card">
  <div class="pad">
    <button data-cam="rotL" data-i-title="c_rotL">⟲</button><button data-cam="fwd" data-i-title="c_fwd">▲</button><button data-cam="rotR" data-i-title="c_rotR">⟳</button>
    <button data-cam="left" data-i-title="c_left">◀</button><button data-cam="back" data-i-title="c_back">▼</button><button data-cam="right" data-i-title="c_right">▶</button>
  </div>
  <div class="padCol">
    <button data-cam="in" data-i-title="c_in">＋</button><button data-cam="out" data-i-title="c_out">－</button>
  </div>
  <div class="padCol">
    <button data-cam="up" data-i-title="c_up">⤒</button><button data-cam="down" data-i-title="c_down">⤓</button>
  </div>
  <div class="mode"><span data-i="drag"></span>
    <div><button id="mRot" class="on" data-i="dRot"></button><button id="mPan" data-i="dPan"></button></div>
  </div>
  <div class="keys" data-i="keys"></div>
</div>
<div id="chat" class="card hidden">
  <div class="chHead"><div><div id="chName"></div><div id="chSub"></div></div><button id="chMin" data-i-title="minimize">–</button></div>
  <div id="chMsgs"></div>
  <div id="chActs" class="acts"></div>
  <form id="chForm"><textarea id="chIn" rows="2"></textarea><button type="submit" id="chSend"></button></form>
</div>
<div id="tip"></div>
<div id="toasts"></div>

<div id="modal">
  <div class="card">
    <div class="mHead"><h2 data-i="welcome"></h2><select class="langSel" aria-label="Language"></select></div>
    <p data-i="intro"></p>
    <ul class="rules" data-i-html="rules"></ul>
    <div id="modeBox"></div>
    <div class="tabs" id="tabs"><button data-tab="hours" class="on" data-i="tabHours"></button><button data-tab="llm" data-i="tabLLM"></button><button data-tab="langs" data-i="tabLangs"></button></div>
    <div id="setForm"></div>
    <div class="mBtns"><button id="mReset" data-i="reset"></button><button id="mGo"></button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =========================================================
   B&B Il Glicine — gioco del receptionist (Three.js)
   Coordinate: x da -12 a 12 (24 m), z da -8 a 8 (16 m)
   1 ora di gioco = 1 minuto reale (a velocità 1×)
   ========================================================= */

// ---------- Traduzioni (it, en, fr, es, de) ----------
const LANGS = [['it','🇮🇹 Italiano','it-IT'],['en','🇬🇧 English','en-GB'],['fr','🇫🇷 Français','fr-FR'],['es','🇪🇸 Español','es-ES'],['de','🇩🇪 Deutsch','de-DE']];

const quizLang = p => (p.speak === 'native' && QL.includes(p.lang)) ? p.lang : 'en';
function quizWho(o) { return o.type === 'couple' ? o.s : o.type === 'pair' ? o.a : (o.full.split(' ').slice(1).join(' ') || o.full); }
function quizFill(s, ctx) {
  return s.replace(/\{([^{}|]*)\|([^{}]*)\}/g, (_, a, b) => ctx.pl ? b : a)
          .replace(/\{(\w+)\}/g, (m, k) => ctx[k] != null ? ctx[k] : m);
}
function quizScript(p) {
  let key;
  if (p.kind === 'in') key = pick(['in1', 'in2']);
  else if (p.kind === 'out') key = pick(['out1', 'out2']);
  else { if (!QSITS.includes(p.sit)) p.sit = pick(QSITS); key = 's' + p.sit; }
  const lang = quizLang(p), li = LANGS.findIndex(l => l[0] === lang);
  const ctx = { pl: p.size === 2, who: quizWho(p.name), n: L.nights[li](p.nights), bill: p.nights * S.price, pr: S.price,
    room: p.room ? L.room[li](p.room[1]) : '', co: hh(S.coTo) };
  const raw = QD[lang][key], f = s => quizFill(s, ctx);
  const steps = raw.slice(0, -1).map(([g, ok, cold, err, fix]) => {
    const opts = [{ q:'ok', text:f(ok) }, { q:'cold', text:f(cold) }, { q:'err', text:f(err), fix:f(fix) }];
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    return { g:f(g), opts };
  });
  return { key, lang, steps, end:f(raw[raw.length - 1]) };
}
function quizPick(i) {
  const p = byId(chatPid); if (!p || !p.conv || !p.conv.quiz) return;
  const c = p.conv, sc = c.script;
  if (c.busy || c.ended || c.rated || c.step >= sc.steps.length) return;
  const st = sc.steps[c.step], o = st.opts[i]; if (!o) return;
  c.msgs.push({ who:'r', text:o.text }); c.ex++; c.picks.push(o.q);
  if (o.q === 'ok') c.msgs.push({ who:'fb', cls:'ok', text:t('fbOk') });
  else c.msgs.push({ who:'fb', cls:'bad', text:(o.q === 'cold' ? t('fbCold') : t('fbErr', o.fix)) + '\n' + t('fbBest', st.opts.find(x => x.q === 'ok').text) });
  c.step++; c.busy = true; renderChat(); markDirty();
  const react = o.q === 'ok' ? '' : pick(QR[sc.lang][o.q]) + ' ';
  setTimeout(() => {
    c.busy = false;
    if (c.rated || c.cut) { if (!c.rated) evaluate(p); renderChat(); return; }
    if (c.step < sc.steps.length) c.msgs.push({ who:'g', text:react + sc.steps[c.step].g });
    else {
      c.msgs.push({ who:'g', text:react + sc.end }); c.ended = true;
      if (p.status === 'queue' && p.kind !== 'ask') c.msgs.push({ who:'sys', text:t(p.kind === 'in' ? 'nowIn' : 'nowOut') });
      evaluate(p);
    }
    renderChat(); markDirty();
  }, 650);
}
function quizEvaluate(p) {
  const c = p.conv, n = c.script.steps.length;
  const errs = c.picks.filter(q => q === 'err').length, colds = c.picks.filter(q => q === 'cold').length, miss = n - c.picks.length;
  const l = Math.max(1, 3 - errs), k = Math.max(1, 3 - colds - miss), s = l + k;
  const comment = t(s >= 6 ? 'qc6' : s === 5 ? 'qc5' : s === 4 ? 'qc4' : 'qc3');
  const tip = miss > 0 ? t('tipCut') : errs && errs >= colds ? t('tipLang') : colds ? t('tipKind') : '';
  applyRating(p, l, k, comment, tip);
}

async function llm(system, convo, prov = S.llm.prov) {
  const P = PROV[prov], cfg = llmCfg(prov);
  if (P.builtin) {
    if (!sampleNS) throw new Error(t('noBuiltin'));
    const msgs = convo.map((m, i) => i === 0 ? { role:'user', content: system + '\n\n---\n\n' + m.content } : m);
    try { const r = await sampleNS(msgs, { cache:false, modelTier:'quick' }); return r.text || ''; }
    catch (e) { throw new Error(e && (e.message || e.code) || 'error'); }
  }
  if (!P.nokey && !cfg.key) throw new Error(t('noKey'));
  const base = (cfg.base || P.base).replace(/\/+$/, ''), model = cfg.model || P.model;
  let res;
  try {
    if (P.kind === 'openai') {
      const h = { 'Content-Type':'application/json' }; if (cfg.key) h.Authorization = 'Bearer ' + cfg.key;
      res = await fetch(base + '/chat/completions', { method:'POST', headers:h, body:JSON.stringify({ model, messages:[{ role:'system', content:system }, ...convo] }) });
    } else if (P.kind === 'anthropic') {
      res = await fetch(base + '/messages', { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key':cfg.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body:JSON.stringify({ model, max_tokens:600, system, messages:convo }) });
    } else {
      res = await fetch(`${base}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(cfg.key)}`, { method:'POST', headers:{ 'Content-Type':'application/json' },
        body:JSON.stringify({ systemInstruction:{ parts:[{ text:system }] }, contents:convo.map(m => ({ role:m.role === 'assistant' ? 'model' : 'user', parts:[{ text:m.content }] })), generationConfig:{ maxOutputTokens:2048 } }) });
    }
  } catch (e) { throw new Error(onClaudeSite() ? t('cspErr') : (e.message || 'network error')); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const er = data.error; throw new Error((er && (er.message || (typeof er === 'string' ? er : ''))) || ('HTTP ' + res.status)); }
  if (P.kind === 'openai') return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  if (P.kind === 'anthropic') return (data.content || []).map(c => c.text || '').join('');
  return ((data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || []).map(p => p.text || '').join('');
}
function parseJSON(txt) {
  if (!txt) return null;
  const m = txt.replace(/```(json)?/g, '').match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return null;
}

      walkTo(maidW, [...exitPrev, RM[next].corr, RM[next].door, RM[next].inside, RM[next].maid], () => {
        maid.state = 'cleaning'; maid.progress = 0; rooms[next].status = 'cleaning'; maidW.heading = RM[next].face; syncRoom(next); markDirty();
      });
      maid.last = null; markDirty();
    } else if (maid.last) {
      maid.state = 'returning';
      walkTo(maidW, [...exitPrev, MAID_BASE], () => { maid.state = 'idle'; maidW.heading = -Math.PI/2; markDirty(); });
      maid.last = null; markDirty();
    } else if (!on) { maid.state = 'off'; maidG.visible = false; addLog('L_maidOff'); markDirty(); }
    return;
  }
  if (maid.state === 'cleaning') {
    maid.progress += dt; const k = maid.room;
    if (maid.progress >= S.cleanMin) {
      rooms[k].status = 'free'; syncRoom(k);
      addLog('L_clean', [{ room:k }], 'good'); toast(t('T_clean', RS(k)));
      maid.state = 'idle'; maid.room = null; maid.last = k; markDirty();
    }
  }
}

$('menuBtn').onclick = () => $('panel').classList.toggle('collapsed');

// ---------- Cambio lingua ----------
document.querySelectorAll('.langSel').forEach(sel => {
  sel.innerHTML = LANGS.map(([c, n], i) => `<option value="${i}">${n}</option>`).join('');
  sel.onchange = () => setLang(+sel.value);
});
function applyStatic() {
  document.documentElement.lang = LANGS[LI][0];
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll('[data-i-html]').forEach(el => el.innerHTML = t(el.dataset.iHtml));
  document.querySelectorAll('[data-i-title]').forEach(el => el.title = t(el.dataset.iTitle));
  document.querySelectorAll('[data-i-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.iAria)));
  document.querySelectorAll('.langSel').forEach(sel => sel.value = LI);
  document.querySelectorAll('#views button').forEach(b => b.textContent = b.dataset.k === 'overview' ? t('overview') : RS(b.dataset.k));
}
function setLang(i) {
  LI = i; try { localStorage.setItem('bnb-lang', LANGS[i][0]); } catch (e) {}
  applyStatic();
  if (!$('modal').classList.contains('hidden')) {
    // conserva i valori già scelti nel modulo
    if ($('sCf')) readSettings();
    renderSettings(); $('mGo').textContent = t(modalFirst ? 'start' : 'save');
  }
  retag(meTag, t('tagYou')); retag(closedTag, t('tagClosed'));
  queue.map(byId).forEach(p => { if (p.status === 'queue') retagParty(p); });
  syncAll(); refreshInfo(); updateDynamic(); renderChat();
}
(function initLang() {
  let code = null; try { code = localStorage.getItem('bnb-lang'); } catch (e) {}
  if (!code) code = (navigator.language || 'it').slice(0, 2).toLowerCase();
  const i = LANGS.findIndex(l => l[0] === code); LI = i >= 0 ? i : 0;
  applyStatic();
  retag(meTag, t('tagYou')); retag(closedTag, t('tagClosed'));
})();
if (innerWidth < 1180) $('panel').classList.add('collapsed');

const tRoof = $('tRoof');
function setRoof(v) { roof.visible = v; tRoof.checked = v; }
tRoof.onchange = e => setRoof(e.target.checked);
function setLow(low) {
  $('tLow').checked = low; wallsG.scale.y = low ? 0.3 : 1;
  upperParts.forEach(p => p.visible = !low); decor.visible = !low; if (low) setRoof(false);
}
$('tLow').onchange = e => setLow(e.target.checked);
tRoof.addEventListener('change', e => { if (e.target.checked) setLow(false); });
setLow(true);

// ---------- Controllo della telecamera: tastiera, pulsanti, modalità di trascinamento ----------
controls.screenSpacePanning = false;
controls.panSpeed = 1.1;
const camHeld = new Set();
const KEYMAP = { KeyW:'fwd', ArrowUp:'fwd', KeyS:'back', ArrowDown:'back', KeyA:'left', ArrowLeft:'left', KeyD:'right', ArrowRight:'right',
  KeyQ:'rotL', KeyE:'rotR', KeyR:'in', Equal:'in', NumpadAdd:'in', KeyF:'out', Minus:'out', NumpadSubtract:'out', KeyZ:'up', KeyX:'down' };
addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,select,textarea')) return; const a = KEYMAP[e.code]; if (a) { camHeld.add(a); e.preventDefault(); } });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) camHeld.delete(a); });
addEventListener('blur', () => camHeld.clear());
document.querySelectorAll('#camPad [data-cam]').forEach(b => {
  const a = b.dataset.cam;
  b.addEventListener('pointerdown', e => { e.preventDefault(); camHeld.add(a); b.classList.add('hold'); b.setPointerCapture(e.pointerId); });
  const up = () => { camHeld.delete(a); b.classList.remove('hold'); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
});
function setDragMode(pan) {
  $('mPan').classList.toggle('on', pan); $('mRot').classList.toggle('on', !pan);
  controls.mouseButtons = pan ? { LEFT:THREE.MOUSE.PAN, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.ROTATE }
                              : { LEFT:THREE.MOUSE.ROTATE, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.PAN };
  controls.touches = pan ? { ONE:THREE.TOUCH.PAN, TWO:THREE.TOUCH.DOLLY_ROTATE } : { ONE:THREE.TOUCH.ROTATE, TWO:THREE.TOUCH.DOLLY_PAN };
}
$('mRot').onclick = () => setDragMode(false);
$('mPan').onclick = () => setDragMode(true);
setDragMode(false);
const UPV = new THREE.Vector3(0, 1, 0);
function moveCamera(dt) {
  if (!camHeld.size) return;
  tween = null;
  const off = camera.position.clone().sub(controls.target), dist = off.length();
  const fwd = off.clone().multiplyScalar(-1); fwd.y = 0; fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, UPV).normalize();
  const mv = new THREE.Vector3(), sp = Math.max(4, dist * 0.9) * dt;
  if (camHeld.has('fwd')) mv.addScaledVector(fwd, sp);
  if (camHeld.has('back')) mv.addScaledVector(fwd, -sp);
  if (camHeld.has('right')) mv.addScaledVector(right, sp);
  if (camHeld.has('left')) mv.addScaledVector(right, -sp);
  if (mv.lengthSq()) {
    const nt = controls.target.clone().add(mv);
    nt.x = Math.max(-28, Math.min(28, nt.x)); nt.z = Math.max(-24, Math.min(26, nt.z));
    mv.subVectors(nt, controls.target); controls.target.add(mv); camera.position.add(mv);
  }
  let rot = 0; if (camHeld.has('rotL')) rot += 1.4 * dt; if (camHeld.has('rotR')) rot -= 1.4 * dt;
  if (rot) { off.applyAxisAngle(UPV, rot); camera.position.copy(controls.target).add(off); }
  let z = 1; if (camHeld.has('in')) z *= Math.pow(0.35, dt); if (camHeld.has('out')) z *= Math.pow(1 / 0.35, dt);
  let tilt = 0; if (camHeld.has('up')) tilt -= 0.9 * dt; if (camHeld.has('down')) tilt += 0.9 * dt;
  if (z !== 1 || tilt) {
    const o = camera.position.clone().sub(controls.target);
    const sph = new THREE.Spherical().setFromVector3(o);
    sph.radius = Math.max(controls.minDistance, Math.min(controls.maxDistance, sph.radius * z));
    sph.phi = Math.max(0.12, Math.min(controls.maxPolarAngle, sph.phi + tilt));
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sph));
  }
}
controls.addEventListener('start', () => { tween = null; });
$('tLabels').onchange = e => labels.visible = e.target.checked;

// hover e clic sulle stanze
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
let hovered = null, downPos = null;
function pickRoom(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left)/r.width)*2 - 1, -((ev.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(mouse, camera);
  const objs = [...pickables, ...(labels.visible ? labels.children : [])];
  if (roof.visible) objs.push(...roof.children);
  const hit = ray.intersectObjects(objs, false)[0];
  return hit && hit.object.userData.room ? hit.object.userData.room : null;
}
function setHover(k) {
  if (hovered === k) return;
  if (hovered) ROOMS[hovered].floor.material.emissive.setHex(0x000000);
  hovered = k; if (k) ROOMS[k].floor.material.emissive.setHex(0x2a2418);
  renderer.domElement.style.cursor = k ? 'pointer' : 'grab';
}
renderer.domElement.addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'mouse') return;
  const k = pickRoom(ev); setHover(k);
  if (k) { tip.textContent = RN(k) + (rooms[k] ? ' · ' + t('st_'+rooms[k].status) : ''); tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 14 + 'px'; tip.style.opacity = 1; }
  else tip.style.opacity = 0;
});
renderer.domElement.addEventListener('pointerdown', ev => downPos = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downPos || Math.hypot(ev.clientX - downPos[0], ev.clientY - downPos[1]) > 6) return;
  const k = pickRoom(ev); if (k) flyTo(k);
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tip.style.opacity = 0; });

// ---------- Giorno / notte dall'orologio ----------
function nightLevel(h) { if (h < 5.5 || h >= 20.5) return 1; if (h < 7.5) return 1 - (h - 5.5)/2; if (h < 18.5) return 0; return (h - 18.5)/2; }
const MOON = new THREE.Color(0x8fa6d9), SUNC = new THREE.Color(0xfff1d6);
function applyDaylight() {
  const h = mod(game.t) / 60, n = nightLevel(h);
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, n); scene.fog.color.copy(scene.background);
  hemi.intensity = 0.5 - 0.38*n;
  if (h >= 6 && h <= 20) { const a = (h - 6) / 14 * Math.PI; sun.position.set(30*Math.cos(a), 6 + 26*Math.sin(a), 12); }
  else sun.position.set(-14, 26, 10);
  sun.intensity = 0.9 - 0.8*n; sun.color.copy(SUNC).lerp(MOON, n);
  const closed = isClosed(game.t);
  RK.forEach(k => { const st = rooms[k].status; roomLights[k].intensity = n * (st === 'occupied' ? 1.0 : st === 'cleaning' ? 1.1 : 0.1); });
  roomLights.reception.intensity = n * (closed ? 0.25 : 1.05);
  roomLights.kitchen.intensity = n * 0.6; roomLights.corridor.intensity = n * 0.8;
  porchLight.intensity = 1.2 * n;
  lampMat.emissiveIntensity = 0.05 + 1.3*n;
  glassMat.emissive.setRGB(0.35*n, 0.25*n, 0.1*n);
}

// ---------- Ciclo principale ----------
const clock = new THREE.Clock();
let uiTimer = 0, lastClosed = null, labelTimer = 0;
function animate() {
  requestAnimationFrame(animate);
  const dtR = Math.min(clock.getDelta(), 0.1);
  const chatHold = S.mode !== 'mgmt' && S.llm.pauseChat && chatPid && byId(chatPid) && byId(chatPid).conv && !byId(chatPid).conv.rated;
  if (game.running && game.speed > 0 && !chatHold) {
    let dtG = dtR * game.speed;           // 1 secondo reale = 1 minuto di gioco (a 1×)
    while (dtG > 0) { const s = Math.min(dtG, 0.5); tick(s); dtG -= s; }
  }
  const c = isClosed(game.t);
  if (c !== lastClosed) { const was = lastClosed; lastClosed = c; syncReception(); if (game.running && was !== null) addLog(c ? 'L_shiftEnd' : 'L_shiftStart'); markDirty(); }
  walkers.forEach(w => animWalker(w, dtR));
  if (tween) {
    tween.t = Math.min(1, tween.t + dtR/1.3); const e = ease(tween.t);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.t >= 1) tween = null;
  }
  moveCamera(dtR);
  applyDaylight();
  labels.children.forEach(l => { const k = Math.max(0.35, Math.min(1.25, camera.position.distanceTo(l.position) / 20)); l.scale.set(4*k, 1.375*k, 1); });
  labelTimer += dtR; if (labelTimer > 0.5) { labelTimer = 0; if (maid.state === 'cleaning') syncRoom(maid.room); }
  uiTimer += dtR;
  if (dirty) { renderDesk(); refreshInfo(); }
  if (uiTimer > 0.15) { uiTimer = 0; updateDynamic(); }
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

resetGame();
Promise.race([
  Promise.all([document.fonts.load('600 50px "DM Sans"'), document.fonts.load('600 76px Fraunces')]),
  new Promise(r => setTimeout(r, 2500))
]).then(() => { labels.children.forEach(s => s.userData.key = ''); syncAll(); }).catch(() => {});
openModal(true);
animate();
</script>
